<div class="login-wrapper">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="icon-circle">
                    <img src="assets/spagna.jpg" alt="Spain Flag" class="flag-icon">
                </div>
                <h2>Welcome Back</h2>
                <p>Access your Food Analytics Dashboard</p>
            </div>
            
            <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" class="login-form">
                <div class="form-group">
                    <label for="userName">
                        <i class="bi bi-person-fill"></i>
                        Username
                    </label>
                    <input 
                        type="text" 
                        ngModel 
                        name="userName" 
                        id="userName" 
                        placeholder="Enter your username"
                        class="form-input"
                        required>
                </div>
                
                <div class="form-group">
                    <label for="userPassword">
                        <i class="bi bi-lock-fill"></i>
                        Password
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            [type]="showPassword ? 'text' : 'password'" 
                            ngModel 
                            name="userPassword" 
                            id="userPassword" 
                            placeholder="Enter your password"
                            class="form-input"
                            required>
                        <button 
                            type="button" 
                            class="toggle-password-btn" 
                            (click)="togglePasswordVisibility()"
                            title="{{ showPassword ? 'Hide password' : 'Show password' }}">
                            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" [disabled]="!loginForm.valid">
                    <span>Sign In</span>
                    <i class="bi bi-arrow-right-circle-fill"></i>
                </button>
            </form>
            
            <div class="login-footer">
                <div class="divider">
                    <span>or</span>
                </div>
                <p class="signup-text">
                    Don't have an account? 
                    <a routerLink="/register" class="signup-link">Create Account</a>
                </p>
                
                
                <div class="copyright">
                    <img src="assets/onrtech.png" alt="ONRTECH" class="copyright-logo">
                    <p>© 2025 ONRTECH - User Panel</p>
                </div>
            </div>
        </div>
    </div>
</div>
