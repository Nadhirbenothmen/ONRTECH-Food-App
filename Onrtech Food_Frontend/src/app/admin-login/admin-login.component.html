<div class="login-wrapper">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="icon-circle">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <h2>Admin Access</h2>
                <p>Secure login for administrators only</p>
            </div>
            
            <form #loginForm="ngForm" (ngSubmit)="login(loginForm)" class="login-form">
                <div class="form-group">
                    <label for="userName">
                        <i class="bi bi-person-fill"></i>
                        Admin Username
                    </label>
                    <input 
                        type="text" 
                        ngModel 
                        name="userName" 
                        id="userName" 
                        placeholder="Enter admin username"
                        class="form-input"
                        required>
                </div>
                
                <div class="form-group">
                    <label for="userPassword">
                        <i class="bi bi-lock-fill"></i>
                        Password
                    </label>
                    <div class="password-input-wrapper">
                        <input 
                            [type]="showPassword ? 'text' : 'password'" 
                            ngModel 
                            name="userPassword" 
                            id="userPassword" 
                            placeholder="Enter your password"
                            class="form-input"
                            required>
                        <button 
                            type="button" 
                            class="toggle-password-btn" 
                            (click)="togglePasswordVisibility()"
                            title="{{ showPassword ? 'Hide password' : 'Show password' }}">
                            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn-submit" [disabled]="!loginForm.valid">
                    <span>Admin Sign In</span>
                    <i class="bi bi-arrow-right-circle-fill"></i>
                </button>
            </form>
            
            <div class="login-footer">
                <div class="divider">
                    <span>or</span>
                </div>
                <p class="signup-text">
                    Are you a user? 
                    <a routerLink="/login" class="signup-link">User Login</a>
                </p>
                
                <div class="copyright">
                    <img src="assets/onrtech.png" alt="ONRTECH" class="copyright-logo">
                    <p>© 2025 ONRTECH - Admin Panel</p>
                </div>
            </div>
        </div>
    </div>
</div>
